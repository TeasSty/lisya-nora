# One-shot Host-0 deploy to reg.ru. Tries FTP / FTPS / SFTP + username variants.
name: Deploy Host0 FTP

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build Host-0 package
        run: npm run build:host0

      - name: Install FTP clients
        run: npm install --no-save basic-ftp@6 ssh2-sftp-client@12

      - name: Deploy via FTP/FTPS/SFTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FTP_PROTOCOL: ftp
        run: node scripts/deploy-host0-once.mjs
